name: Verify Santa Circle
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Exercise a concurrent draw on PostgreSQL
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          npm run test:postgres
      - name: Compile the production configuration with test values
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://santa-release.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_releaseFixture
        run: npm run build
